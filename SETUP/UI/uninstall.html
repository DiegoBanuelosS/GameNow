<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameNow - Desinstalador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="installer-window uninstall-window">
      <div class="ambient-aura"></div>

      <section class="uninstall-hero" id="uninstall-hero" aria-hidden="true">
        <img src="assets/672903.jpg" alt="" class="uninstall-hero-image" />
        <div class="uninstall-hero-fade"></div>
      </section>

      <header class="installer-topbar">
        <img
          src="assets/logo.svg"
          alt="GameNow"
          class="installer-logo"
          id="uninstaller-logo"
        />
      </header>

      <main class="installer-content" id="uninstaller-main">
        <section class="installer-step active animate-in" id="step-menu">
          <h1 class="installer-title">¿En qué te podemos ayudar?</h1>
          <div class="step-actions uninstall-options">
            <button type="button" class="btn-primary" id="btn-update">
              <i data-lucide="download" aria-hidden="true"></i>
              Actualizar
            </button>
            <button type="button" class="btn-secondary" id="btn-repair">
              <i data-lucide="wrench" aria-hidden="true"></i>
              Reparar
            </button>
            <button type="button" class="btn-danger" id="btn-uninstall">
              <i data-lucide="trash-2" aria-hidden="true"></i>
              Desinstalar
            </button>
            <button type="button" class="btn-secondary" id="btn-close">
              <i data-lucide="x" aria-hidden="true"></i>
              Cerrar
            </button>
          </div>
        </section>

        <section class="installer-step" id="step-progress" style="display: none;" aria-hidden="true">
          <div class="checkmark-icon uninstall-check" id="uninstall-check" aria-hidden="true">
            <i data-lucide="check" class="result-icon-ok"></i>
            <i data-lucide="x" class="result-icon-fail"></i>
          </div>
          <h1 class="installer-title" id="uninstall-progress-title">Esperamos Volverte a ver Pronto</h1>
          <p class="uninstall-reason" id="uninstall-reason" role="alert" hidden></p>
          <div class="progress-box" id="uninstall-progress-box">
            <div class="progress-track">
              <div class="progress-bar" id="uninstall-progress-bar" style="width: 0%;"></div>
            </div>
            <div class="progress-meta">
              <span class="progress-status" id="uninstall-progress-status">Desinstalando GameNow...</span>
              <span class="progress-percent" id="uninstall-progress-percent">0%</span>
            </div>
          </div>
          <div class="step-actions progress-finished-actions" id="uninstall-done-actions" style="display: none;">
            <button type="button" class="btn-primary" id="btn-done">
              Cerrar
            </button>
          </div>
        </section>
      </main>
    </div>
    <script src="https://unpkg.com/lucide@1.47.0/dist/umd/lucide.min.js"></script>
    <script>
      lucide.createIcons({ attrs: { width: 18, height: 18, "stroke-width": 2 } });

      const stepMenu = document.getElementById("step-menu");
      const stepProgress = document.getElementById("step-progress");
      const progressBar = document.getElementById("uninstall-progress-bar");
      const progressPercent = document.getElementById("uninstall-progress-percent");
      const progressBox = document.getElementById("uninstall-progress-box");
      const progressTitle = document.getElementById("uninstall-progress-title");
      const progressCheck = document.getElementById("uninstall-check");
      const doneActions = document.getElementById("uninstall-done-actions");
      const failReason = document.getElementById("uninstall-reason");

      const uninstallWindow = document.querySelector(".uninstall-window");
      const uninstallHero = document.getElementById("uninstall-hero");
      const heroImage = document.querySelector(".uninstall-hero-image");
      const progressStatus = document.getElementById("uninstall-progress-status");
      const logo = document.getElementById("uninstaller-logo");
      let isTransitioning = false;
      let mode = "uninstall";

      const flows = {
        uninstall: {
          image: "assets/672903.jpg",
          status: "Desinstalando GameNow...",
          done: "GameNow fue Desinstalado Exitosamente",
        },
        repair: {
          image: "assets/672904.jpg",
          status: "Revisando tu instalación",
          done: "GameNow Fue reparado Exitosamente",
          phases: [
            "Revisando tu instalación",
            "Buscando problemas",
            "Corrigiendo los problemas",
            "Descargando",
          ],
          reviewFiles: [
            "gamenow.exe",
            "flutter_windows.dll",
            "data\\icudtl.dat",
            "data\\app.so",
            "data\\flutter_assets\\AssetManifest.bin",
            "data\\flutter_assets\\FontManifest.json",
          ],
          downloadFiles: [
            "gamenow.exe",
            "flutter_windows.dll",
            "data\\icudtl.dat",
            "data\\flutter_assets\\kernel_blob.bin",
            "data\\flutter_assets\\AssetManifest.bin",
          ],
        },
        update: {
          image: "assets/672904.jpg",
          status: "Buscando actualizaciones",
          done: "GameNow se actualizó correctamente",
          phases: [
            "Buscando actualizaciones",
            "Descargando la nueva versión",
            "Instalando archivos",
            "Finalizando",
          ],
          reviewFiles: [
            "gamenow.exe",
            "flutter_windows.dll",
            "data\\icudtl.dat",
            "data\\app.so",
            "data\\flutter_assets\\AssetManifest.bin",
          ],
          downloadFiles: [
            "gamenow.exe",
            "flutter_windows.dll",
            "data\\icudtl.dat",
            "data\\flutter_assets\\kernel_blob.bin",
            "data\\flutter_assets\\AssetManifest.bin",
          ],
        },
      };

      function swapText(el, text) {
        if (!el || el.textContent === text) return;
        el.classList.remove("text-in");
        el.classList.add("text-out");
        window.setTimeout(() => {
          el.textContent = text;
          el.classList.remove("text-out");
          void el.offsetWidth;
          el.classList.add("text-in");
        }, 180);
      }

      const hostMode = !!(window.chrome && window.chrome.webview);
      let visualReady = false;

      function notify(action) {
        if (!hostMode) return false;
        window.chrome.webview.postMessage({ action: action });
        return true;
      }

      function beginHostFlow(nextMode) {
        mode = nextMode === "repair" ? "repair" : nextMode === "update" ? "update" : "uninstall";
        const flow = flows[mode];
        heroImage.src = flow.image;
        progressBar.style.width = "0%";
        progressPercent.textContent = "0%";
        progressBox.style.display = "";
        progressCheck.classList.remove("visible");
        progressCheck.style.display = "none";
        doneActions.style.display = "none";
        clearFailure();
        progressTitle.textContent = flow.phases ? flow.phases[0] : "Esperamos Volverte a ver Pronto";
        progressStatus.textContent = flow.status;
        showStep(stepProgress);
      }

      function clearFailure() {
        stepProgress.classList.remove("is-error");
        failReason.hidden = true;
        failReason.textContent = "";
      }

      function showFailure(reason) {
        stepProgress.classList.add("is-error");
        failReason.textContent = reason || "Ocurrió un error inesperado.";
        failReason.hidden = false;
      }

      window.applySetupUpdate = function (data) {
        if (!data) return;
        if (!visualReady) {
          beginHostFlow(data.mode);
          visualReady = true;
        }
        if (typeof data.percent === "number") {
          progressBar.style.width = data.percent + "%";
          progressPercent.textContent = Math.round(data.percent) + "%";
        }
        if (data.title) swapText(progressTitle, data.title);
        if (data.status) swapText(progressStatus, data.status);
        if (data.done) {
          if (data.error) showFailure(data.reason);
          progressBox.style.display = "none";
          progressCheck.style.display = "flex";
          progressCheck.removeAttribute("aria-hidden");
          requestAnimationFrame(() => progressCheck.classList.add("visible"));
          doneActions.style.display = "flex";
        }
      };

      let progressTimer = null;

      function showStep(next) {
        const steps = [stepMenu, stepProgress];
        const current = steps.find((step) => step.classList.contains("active"));
        if (!next || next === current || isTransitioning) return;
        isTransitioning = true;

        if (logo) {
          logo.classList.remove("glint");
          void logo.offsetWidth;
          logo.classList.add("glint");
        }

        const reveal = () => {
          if (current) {
            current.classList.remove("active", "animate-out", "animate-in");
            current.style.display = "none";
            current.setAttribute("aria-hidden", "true");
          }
          next.style.display = "flex";
          next.classList.remove("animate-out");
          void next.offsetWidth;
          next.classList.add("active", "animate-in");
          next.removeAttribute("aria-hidden");

          const onProgress = next === stepProgress;
          uninstallWindow.classList.toggle("is-progress", onProgress);
          uninstallHero.toggleAttribute("aria-hidden", !onProgress);

          setTimeout(() => {
            isTransitioning = false;
          }, 560);
        };

        if (!current) {
          reveal();
          return;
        }

        current.classList.remove("animate-in");
        current.classList.add("animate-out");
        setTimeout(reveal, 280);
      }

      function startFlow() {
        const flow = flows[mode];
        if (progressTimer) clearInterval(progressTimer);
        heroImage.src = flow.image;
        progressStatus.textContent = flow.status;
        showStep(stepProgress);
        progressBar.style.width = "0%";
        progressPercent.textContent = "0%";
        progressBox.style.display = "";
        progressTitle.textContent = flow.phases ? flow.phases[0] : "Esperamos Volverte a ver Pronto";
        progressCheck.classList.remove("visible");
        progressCheck.style.display = "none";
        doneActions.style.display = "none";
        clearFailure();

        let percent = 0;
        let phaseIndex = -1;
        let fileSlot = -1;
        progressTimer = setInterval(() => {
          percent = Math.min(100, percent + 2);
          progressBar.style.width = percent + "%";
          progressPercent.textContent = percent + "%";

          if (flow.phases) {
            const index = Math.min(flow.phases.length - 1, Math.floor(percent / 25));
            if (index !== phaseIndex) {
              phaseIndex = index;
              fileSlot = -1;
              swapText(progressTitle, flow.phases[index]);
            }

            const downloading =
              mode === "update"
                ? index >= 1
                : index === flow.phases.length - 1;
            const files = downloading ? flow.downloadFiles : flow.reviewFiles;
            const nextSlot = Math.floor(percent / 8) % files.length;
            if (nextSlot !== fileSlot) {
              fileSlot = nextSlot;
              const label =
                mode === "update"
                  ? downloading
                    ? "Descargando"
                    : "Comprobando"
                  : downloading
                    ? "Descargando"
                    : "Revisando";
              swapText(progressStatus, label + " " + files[nextSlot]);
            }
          }

          if (percent < 100) return;

          clearInterval(progressTimer);
          progressTimer = null;
          progressBox.style.display = "none";
          swapText(progressTitle, flow.done);
          progressCheck.style.display = "flex";
          progressCheck.removeAttribute("aria-hidden");
          requestAnimationFrame(() => progressCheck.classList.add("visible"));
          doneActions.style.display = "flex";
        }, 80);
      }

      document.getElementById("btn-uninstall").addEventListener("click", () => {
        mode = "uninstall";
        if (notify("uninstall")) return;
        startFlow();
      });

      document.getElementById("btn-update").addEventListener("click", () => {
        mode = "update";
        if (notify("update")) return;
        startFlow();
      });

      document.getElementById("btn-repair").addEventListener("click", () => {
        mode = "repair";
        if (notify("repair")) return;
        startFlow();
      });

      function closeWindow() {
        if (notify("close")) return;
        window.close();
      }

      document.getElementById("btn-close").addEventListener("click", closeWindow);
      document.getElementById("btn-done").addEventListener("click", closeWindow);
    </script>
  </body>
</html>
